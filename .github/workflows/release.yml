# Builds the playable game (docs/BUILD.md) for Linux, Windows and macOS with Godot 4.3 .NET,
# when a version tag (v1.0.0...) is pushed or by hand, and attaches the zips to a release.
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Godot 4.3 .NET and its export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable.mono"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable.mono/"
          rm -rf godot.zip templates.tpz templates
      - name: Build
        run: tools/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: animundi-builds
          path: build/Animundi-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Animundi-*.zip
